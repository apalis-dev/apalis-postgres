[graph]
exclude-unpublished = true

[advisories]
unmaintained = "none"
ignore = []

[licenses]
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "MIT",
    "Unicode-3.0",
    "Zlib",
    "ISC",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "deny"
highlight = "all"
skip-tree = [
    { name = "windows_x86_64_msvc" },
    { name = "windows_x86_64_gnullvm" },
    { name = "windows_x86_64_gnu" },
    { name = "windows_i686_msvc" },
    { name = "windows_i686_gnullvm" },
    { name = "windows_i686_gnu" },
    { name = "windows_aarch64_msvc" },
    { name = "windows_aarch64_gnullvm" },
    { name = "windows-targets" },
    { name = "windows-sys" },
    # TODO: @geofmureithi Investigate why these are causing issues possibly due to sqlx dependencies
    { name = "getrandom" },
    { name = "hashbrown" },
    { name = "rand" },
    { name = "rand_chacha" },
    { name = "rand_core" },
    { name = "redox_syscall" },
    # sqlx 0.9 pulls two incompatible digest stacks internally: sqlx-core uses
    # digest 0.10 / sha2 0.10, while sqlx-postgres (hmac/md-5/hkdf) uses 0.11.
    { name = "block-buffer" },
    { name = "crypto-common" },
    { name = "digest" },
    { name = "sha2" },
]

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-git = []
