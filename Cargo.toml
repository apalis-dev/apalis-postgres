[package]
name = "apalis-postgres"
version = "1.0.0-rc.10"
authors = ["Njuguna Mureithi <mureithinjuguna@gmail.com>"]
edition = "2024"
repository = "https://github.com/apalis-dev/apalis-postgres"
license-file = "LICENSE"
description = "Background task processing for rust using apalis and postgres"
readme = "README.md"
homepage = "https://github.com/apalis-dev/apalis-postgres"
documentation = "https://docs.rs/apalis-postgres"
keywords = ["apalis", "postgres", "jobs", "queue", "worker"]
categories = ["asynchronous", "database", "network-programming"]
publish = true

[features]
default = ["migrate", "tokio-comp"]
## Enables fine-grained worker and task tracking
task-tracking = ["apalis-core/task-context"]

## Enable migrations and macros for sqlx
migrate = ["sqlx/migrate", "sqlx/macros"]
## Enable the async-std runtime for sqlx
async-std-comp = ["async-std", "sqlx/runtime-async-std", "sqlx/tls-rustls"]
## Enable the async-std runtime for sqlx with native-tls
async-std-comp-native-tls = [
  "async-std",
  "sqlx/runtime-async-std",
  "sqlx/tls-native-tls",
]
## Enable the tokio runtime for sqlx
tokio-comp = ["tokio", "sqlx/runtime-tokio", "sqlx/tls-rustls"]
## Enable the tokio runtime for sqlx with native-tls
tokio-comp-native-tls = ["tokio", "sqlx/runtime-tokio", "sqlx/tls-native-tls"]


docsrs = ["dep:document-features"]

[dependencies]
apalis-core = { version = "1.0.0-rc.11", default-features = false, features = [
  "sleep",
  "ulid",
] }
apalis-codec = { version = "0.1.0-rc.11", features = ["json"] }
serde = { version = "1", features = ["derive"], default-features = false }
pin-project = "1.1.13"
serde_json = "1"
futures = "0.3.34"
thiserror = "2"
tokio = { version = "1", features = [
  "rt",
  "net",
], optional = true, default-features = false }
async-std = { version = "1.13.2", optional = true, default-features = false }
ulid = { version = "3", features = ["serde"] }
tracing = "0.1"


[dependencies.sqlx]
version = "0.9"
default-features = false
features = ["postgres", "json", "sqlx-toml"]

[dependencies.document-features]
version = "0.2"
optional = true


[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
once_cell = "1.21.4"
apalis = { version = "1.0.0-rc.11" }
apalis-workflow = { version = "0.1.0-rc.11" }
futures-util = "0.3.34"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tokio-util = "0.7.19"

[package.metadata.docs.rs]
# defines the configuration attribute `docsrs`
rustdoc-args = ["--cfg", "docsrs"]
all-features = true

[package.metadata.cargo-udeps.ignore]
normal = ["document-features"]
